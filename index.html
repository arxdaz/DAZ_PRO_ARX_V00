<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Archive</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e6eef0;--a1:rgba(45,212,191,.36);--a2:rgba(86,140,255,.30);--a3:rgba(120,230,170,.28);--a4:rgba(150,130,255,.16);
  --fg:#16201f;--mut:#5f6e6c;--line:rgba(0,40,40,.12);--glass:rgba(255,255,255,.5);--glassb:rgba(255,255,255,.72);--glassx:rgba(240,248,248,.78);--menu:rgba(247,251,251,.93);
  --sh:0 10px 40px rgba(10,50,60,.16);--hov:rgba(0,60,60,.08);--act:#0b8c88;--dz1:#17302e;--dz2:#5f7f7b;--dzi:#1b3331;--dzo:#8fb0ac;--dzs:#2fe0cc;--dzh:#2dd4bf;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060c15;--a1:rgba(20,184,166,.32);--a2:rgba(59,130,246,.32);--a3:rgba(52,211,153,.22);--a4:rgba(139,92,246,.20);--fg:#e8f1f0;--mut:#8fa3a1;--line:rgba(255,255,255,.12);--glass:rgba(16,28,40,.5);--glassb:rgba(255,255,255,.14);--glassx:rgba(8,16,26,.78);--menu:rgba(10,18,28,.93);--dz1:#fff;--dz2:#aab2c6;--dzi:#f4f7ff;--dzo:#aab3c7;--dzs:#fff;--dzh:#fff;--sh:0 10px 40px rgba(0,0,0,.5);--hov:rgba(255,255,255,.09);--act:#4de0cf;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060c15;--a1:rgba(20,184,166,.32);--a2:rgba(59,130,246,.32);--a3:rgba(52,211,153,.22);--a4:rgba(139,92,246,.20);--fg:#e8f1f0;--mut:#8fa3a1;--line:rgba(255,255,255,.12);--glass:rgba(16,28,40,.5);--glassb:rgba(255,255,255,.14);--glassx:rgba(8,16,26,.78);--menu:rgba(10,18,28,.93);--dz1:#fff;--dz2:#aab2c6;--dzi:#f4f7ff;--dzo:#aab3c7;--dzs:#fff;--dzh:#fff;--sh:0 10px 40px rgba(0,0,0,.5);--hov:rgba(255,255,255,.09);--act:#4de0cf;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
*,*::before,*::after{box-sizing:inherit;font-family:'Century Gothic',CenturyGothic,'URW Gothic',sans-serif}
[hidden]{display:none!important}
*{touch-action:none}
#thumbs,#thumbs *{touch-action:pan-y}
body{margin:0;position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);overflow:hidden;overscroll-behavior:none;color:var(--fg);display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;filter:blur(26px);animation:aurora 38s ease-in-out infinite alternate;
  background:radial-gradient(38% 34% at 18% 22%,var(--a1),transparent 70%),radial-gradient(34% 38% at 82% 18%,var(--a2),transparent 70%),radial-gradient(40% 36% at 70% 84%,var(--a3),transparent 70%),radial-gradient(30% 30% at 25% 85%,var(--a4),transparent 70%)}
@keyframes aurora{0%{transform:translate3d(-2%,-1%,0) scale(1) rotate(0)}50%{transform:translate3d(2%,2%,0) scale(1.08) rotate(3deg)}100%{transform:translate3d(-1%,3%,0) scale(1.04) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){body::before,.dz-fl,.dz-halo,.idle .arw{animation:none!important}}
header,#bar{background:var(--glass);border:1px solid var(--glassb);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
header{position:relative;z-index:20;padding:13px 130px;border-width:0 0 1px;text-align:center}
.cbtn{position:absolute;left:16px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 15px;border-radius:999px;font-size:13px;letter-spacing:.06em;color:var(--fg);background:var(--glass);border:1px solid var(--glassb);cursor:pointer;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:background .2s}
.cbtn:hover,.cbtn.act{background:var(--glassx)}
.cbtn svg,.citem svg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cbtn svg{width:16px;height:16px}
.cmenu{position:absolute;left:16px;top:calc(100% + 8px);width:min(310px,calc(100vw - 20px));padding:6px;border-radius:20px;text-align:left;background:var(--menu);border:1px solid var(--glassb);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);box-shadow:var(--sh);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top left;transition:opacity .25s ease,transform .25s ease,visibility 0s .25s}
.cmenu.open{opacity:1;visibility:visible;transform:none;transition:opacity .25s ease,transform .25s ease}
.citem{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;color:var(--fg);text-decoration:none}
.citem+.citem{border-top:1px solid var(--line);border-top-left-radius:0;border-top-right-radius:0}
.citem:hover{background:var(--hov)}
.citem svg{width:20px;height:20px;flex:none;color:var(--act)}
.citem small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.citem span{font-size:14px;letter-spacing:.03em}
.lang{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--glassb);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.lang button{border:0;background:transparent;color:var(--mut);font-size:12px;letter-spacing:.1em;height:26px;padding:0 11px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.lang button:hover{color:var(--fg)}
.lang button.on{background:var(--glassx);color:var(--act)}
@media (max-width:560px){header{padding:12px 84px}.cbtn{left:10px;width:36px;padding:0}.cbtn span{display:none}.cmenu{left:10px}.lang{right:10px}}
h1{margin:0;font-size:14px;font-weight:400;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){h1{white-space:normal;font-size:12px;line-height:1.5}}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}
#scroll{position:absolute;inset:0;overflow:hidden;overscroll-behavior:none;display:flex}
.zoomed #scroll{overflow:auto}
#zoomer{flex:none;margin:auto;width:100%;height:100%;padding:20px 20px 88px}
#book{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#prog{position:absolute;left:0;top:0;height:2px;background:var(--act);width:0;transition:width .15s;z-index:8}

/* ---- libro ---- */
#bk{position:relative;flex:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .9s cubic-bezier(.5,.05,.25,1)}
#bk.noanim,#bk.noanim *{transition:none!important}
#bsh{position:absolute;top:0;left:0;height:100%;width:50%;box-shadow:0 26px 60px rgba(0,0,0,.28),0 4px 16px rgba(0,0,0,.16);transition:left .9s cubic-bezier(.5,.05,.25,1),width .9s cubic-bezier(.5,.05,.25,1)}
.sheet{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,.05,.25,1)}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;background:#fff;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{transform:rotateY(180deg)}
.face img,.pg img{width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.sh{position:absolute;inset:0;pointer-events:none}
.front .sh{opacity:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.45));transition:opacity .45s ease-out .45s}
.sheet.flipped .front .sh{opacity:1;transition:opacity .45s ease-in}
.back .sh{opacity:1;background:linear-gradient(270deg,rgba(0,0,0,0),rgba(0,0,0,.45));transition:opacity .45s ease-in}
.sheet.flipped .back .sh{opacity:0;transition:opacity .45s ease-out .45s}
.pg{position:absolute;inset:0;opacity:0;transform:scale(.985);transition:opacity .4s ease,transform .45s ease;background:#fff;pointer-events:none}
.pg.on{pointer-events:auto}
.lk{position:absolute;display:block;border-radius:6px;cursor:pointer;outline:1px solid transparent;transition:background .2s,outline-color .2s,box-shadow .2s;-webkit-tap-highlight-color:rgba(255,255,255,.3)}
.lk:hover,.lk:focus-visible{background:rgba(255,255,255,.16);outline-color:rgba(255,255,255,.8);box-shadow:0 0 0 4px rgba(255,255,255,.14)}
.pg.on{opacity:1;transform:none}

/* ---- loader (logo animado) ---- */
#loader{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:var(--glassx);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);transition:opacity .8s ease}
#loader.done{opacity:0;pointer-events:none}
.dzlogo{width:84px;height:auto;overflow:visible;margin-bottom:10px;transition:opacity .5s}
.dz-fl{animation:dzflow 8s linear infinite}
@keyframes dzflow{from{stroke-dashoffset:0}to{stroke-dashoffset:-.5}}
.dz-halo{animation:dzhalo 3.5s ease-in-out infinite alternate}
@keyframes dzhalo{from{opacity:.35}to{opacity:.85}}
#loader.err .dzlogo{opacity:.35}
#loader.err .dz-fl,#loader.err .dz-halo{animation-play-state:paused}
#ltxt{font-size:15px;letter-spacing:.1em}
#lsub{font-size:13px;color:var(--mut);margin:0;letter-spacing:.04em}

/* ---- barra ---- */
#bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:max-content;z-index:5;display:flex;align-items:center;gap:3px;padding:6px 16px;border-radius:999px;box-shadow:var(--sh),inset 0 1px 0 var(--glassb);max-width:calc(100% - 12px);overflow-x:auto;scrollbar-width:none;transition:opacity .8s ease}
#bar::-webkit-scrollbar{display:none}
#stage.idle #bar{opacity:.55}
.ib{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;padding:0;cursor:pointer;transition:background .15s}
.ib:hover:not(:disabled){background:var(--hov)}
.ib:disabled{opacity:.3;cursor:default}
.ib.act{color:var(--act)}
#zin .i-out,#vm .i-one{display:none}
#zin.max .i-in,#vm.single .i-two{display:none}
#zin.max .i-out,#vm.single .i-one{display:block}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sep{flex:none;width:1px;height:22px;background:var(--line);margin:0 6px}
#pgw{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);padding:0 6px}
#pg{width:64px;height:30px;text-align:center;font-size:13px;color:var(--fg);background:var(--hov);border:1px solid transparent;border-radius:999px;outline:0}
#pg:focus{border-color:var(--act)}
.arw{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer;color:var(--fg);background:var(--glass);border:1px solid var(--glassb);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);opacity:.8;transition:opacity .6s ease,background .2s}
#aprev{left:12px}#anext{right:12px}
.arw svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arw:hover{opacity:1;background:var(--glassx)}
.arw:disabled{opacity:0;pointer-events:none;animation:none}
.idle .arw:not(:disabled){animation:breathe 3.8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:.85}}
#thumbs:not([hidden]) ~ .arw{display:none}
@media (max-width:560px){
  .arw{width:36px;height:36px}#aprev{left:6px}#anext{right:6px}
  #bar{gap:0;padding:5px 9px;bottom:14px}
  .ib{width:34px;height:34px}.ib svg{width:18px;height:18px}
  #pg{width:56px}#pgw{padding:0 3px;gap:4px}.sep{margin:0 3px}
  #fs{display:none}
}
#thumbs{position:absolute;inset:0;z-index:4;background:var(--glassx);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);overflow:auto;padding:24px 24px 96px}
#thumbs{overflow-x:hidden;overscroll-behavior:contain}
#tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:18px}
.th{cursor:pointer;text-align:center;font-size:12px;color:var(--mut)}
.th img{width:100%;display:block;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.22);border:2px solid transparent}
.th.cur img,.th:hover img{border-color:var(--act)}
.th span{display:block;margin-top:6px}
</style>
</head>

<script>

const HOTSPOTS = [];

const $ = s => document.querySelector(s);
const I18N = {
  en: { loading: 'Loading document', lsub: 'This may take a few seconds…', err: 'Unable to load document.', errsub: 'Please check the file and try again.', contact: 'Contact', phone: 'Phone / WhatsApp', email: 'Email', prev: 'Previous page', next: 'Next page', goto: 'Go to page', thumbs: 'Thumbnails', single: 'Single page view', two: 'Two-page view', zin: 'Zoom in', zout: 'Zoom out', fit: 'Fit to screen', fs: 'Full screen', open: 'Open' },

};
let lang = 'en', loadTok = 0;
const T = k => I18N[lang][k];
function pickLang(){
  let l = null;
  try { l = new URLSearchParams(location.search).get('lang'); } catch (e){}
  if (!I18N[l]) { try { l = localStorage.getItem('daz_lang'); } catch (e){} }
  if (!I18N[l]) l = ((navigator.language || 'en') + '').toLowerCase().startsWith('es') ? 'es' : 'en';
  if (!PDFS[l]) l = PDFS.es ? 'es' : 'en';
  return l;
}
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T(e.dataset.t); });
  document.querySelectorAll('[data-ti]').forEach(e => { e.title = T(e.dataset.ti); if (e.tagName === 'INPUT') e.setAttribute('aria-label', T(e.dataset.ti)); });
  document.querySelectorAll('#lang button').forEach(b => { const on = b.dataset.lang === lang; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });

  if (ready) setViewTitle();
}
const FT = 900; // flip duration (ms), keep in sync with the CSS (.9s)
let pages = [], plinks = [], thumbs = [], total = 0, orig = 0, padIdx = -1, ratio = 1.414;
let forced = null, mode = null, cur = 0, nSh = 0, pw = 0, ph = 0, anim = false, ready = false, zoom = 1, sheets = [], slides = [];
const bk = $('#bk'), bsh = $('#bsh');
const ctrls = ['prev','next','pg','tb','vm','zin','fit','fs'].map(i => $('#' + i));
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function setProg(p){ $('#prog').style.width = (p * 100) + '%'; if (p >= 1) setTimeout(() => $('#prog').style.width = '0', 300); }
function num(i){ return (padIdx < 0 || i < padIdx) ? i + 1 : (i === padIdx ? padIdx : i); } // the filler page has no number
function idxOf(v){ return (padIdx < 0 || v <= padIdx) ? v - 1 : v; }
function lastIdx(){ return padIdx === total - 1 ? total - 2 : total - 1; }
function visible(){
  if (mode === 'single') return [cur];
  if (cur === 0) return [0];
  if (cur === nSh) return [total - 1];
  return [2 * cur - 1, 2 * cur];
}
function updUI(){
  const v = visible();
  $('#pg').value = v.filter(i => i !== padIdx).map(num).join('–');
  $('#tot').textContent = '/ ' + orig;
  $('#prev').disabled = cur <= 0;
  $('#next').disabled = mode === 'single' ? cur >= lastIdx() : cur >= nSh;
  $('#aprev').disabled = $('#prev').disabled; $('#anext').disabled = $('#next').disabled;
  document.querySelectorAll('.th').forEach(t => t.classList.toggle('cur', v.includes(+t.dataset.i)));
}

// Cover and back cover are centered; the spread shadow follows what is visible
function shift(){
  let x = 0, l = 0, w = pw;
  if (mode === 'spread'){
    if (cur === 0){ x = -pw / 2; l = pw; }
    else if (cur === nSh){ x = pw / 2; }

  }
  bk.style.transform = 'translateX(' + x + 'px)';
  bsh.style.left = l + 'px'; bsh.style.width = w + 'px';

function clearBk(){ [...bk.children].forEach(c => { if (c !== bsh) c.remove(); }); }
function hostOf(u){ try { return new URL(u).hostname; } catch (e){ return u; } }
function addLinks(host, i){

    if (!/^(https?:|mailto:|tel:)/i.test(l.url)) return;   // only safe link types
    const a = document.createElement('a');
    a.className = 'lk'; a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.title = T('open') + ' · ' + hostOf(l.url);
    a.style.cssText = 'left:' + l.x * 100 + '%;top:' + l.y * 100 + '%;width:' + l.w * 100 + '%;height:' + l.h * 100 + '%';
    host.appendChild(a);
  });
}
function mkFace(cls, i){
  const f = document.createElement('div'); f.className = 'face ' + cls;
  f.appendChild(mkImg(pages[i])); addLinks(f, i);
  const s = document.createElement('i'); s.className = 'sh'; f.appendChild(s);
  return f;
}
function mkImg(src){ const im = new Image(); im.alt = ''; im.draggable = false; im.src = src; return im; }

function buildSpread(){
  sheets = [];
  for (let k = 0; k < nSh; k++){
    const s = document.createElement('div'); s.className = 'sheet';
    s.append(mkFace('front', 2 * k), mkFace('back', 2 * k + 1)); bk.appendChild(s); sheets.push(s);
  }
}
function place(){
  sheets.forEach((s, k) => {
    const fl = k < cur;
    s.classList.toggle('flipped', fl);
    s.style.zIndex = fl ? k + 1 : nSh - k;
    s.style.display = (fl ? k >= cur - 3 : k < cur + 3) ? '' : 'none';
  });
}
function buildSingle(){
  slides = pages.map((src, i) => { const d = document.createElement('div'); d.className = 'pg'; d.appendChild(mkImg(src)); addLinks(d, i); bk.appendChild(d); return d; });
}
function placeSingle(){
  slides.forEach((d, i) => { d.classList.toggle('on', i === cur); d.classList.toggle('past', i < cur); d.style.display = Math.abs(i - cur) <= 2 ? '' : 'none'; });
}
function switchMode(nm){
  const p = mode === null ? 0 : (mode === 'spread' ? (cur === 0 ? 0 : cur === nSh ? total - 1 : 2 * cur - 1) : cur);
  mode = nm; clearBk(); bk.classList.add('noanim');
  if (mode === 'spread'){ nSh = total / 2; buildSpread(); cur = p <= 0 ? 0 : Math.min(nSh, Math.ceil(p / 2)); place(); }
  else { buildSingle(); cur = p === padIdx ? Math.max(0, p - 1) : p; placeSingle(); }
  void bk.offsetWidth; requestAnimationFrame(() => bk.classList.remove('noanim'));
}
function setViewTitle(){ $('#vm').title = T(mode === 'spread' ? 'single' : 'two'); }
function sizeBook(){
  if (!ready) return;
  bk.classList.add('noanim');   // size changes (zoom, resize, mode) never animate: only page turns do
  const h = $('#book'), aw = h.clientWidth, ah = h.clientHeight;
  const nm = forced || (aw / zoom < 600 ? 'single' : 'spread');   // decided on the un-zoomed width, so zooming never changes the mode
  if (nm !== mode) switchMode(nm);
  const cw = mode === 'spread' ? 2 : 1;
  pw = Math.max(60, Math.floor(Math.min(aw / cw, ah / ratio)));
  ph = Math.round(pw * ratio);
  bk.style.width = cw * pw + 'px'; bk.style.height = ph + 'px'; bk.style.perspective = (pw * 4) + 'px';
  shift(); updUI();
  const vm = $('#vm'); vm.classList.toggle('act', mode === 'spread'); vm.classList.toggle('single', mode === 'single');
  setViewTitle();
  void bk.offsetWidth; requestAnimationFrame(() => { if (!pinching) bk.classList.remove('noanim'); });
}

function go(dir){
  if (!ready || anim) return;
  if (mode === 'single'){
    let t = cur + dir; if (t === padIdx) t += dir;
    if (t < 0 || t > lastIdx()) return;
    cur = t; placeSingle(); updUI(); return;
  }
  const t = cur + dir; if (t < 0 || t > nSh) return;
  const s = sheets[dir > 0 ? cur : cur - 1];
  for (let j = Math.max(0, cur - 4); j <= Math.min(nSh - 1, cur + 4); j++) sheets[j].style.display = '';
  s.style.zIndex = 1000; cur = t; s.classList.toggle('flipped', dir > 0);
  shift(); updUI(); anim = true;
  setTimeout(() => { anim = false; place(); }, FT + 40);
}
function jump(c){
  if (c === cur) return;
  bk.classList.add('noanim'); cur = Math.max(0, Math.min(nSh, c)); place(); shift(); updUI();
  void bk.offsetWidth; requestAnimationFrame(() => bk.classList.remove('noanim'));
}
function goToPage(i){
  closeThumbs();
  if (mode === 'single'){ cur = i === padIdx ? Math.max(0, i - 1) : i; placeSingle(); updUI(); return; }
  const c = i <= 0 ? 0 : Math.min(nSh, Math.ceil(i / 2));
  Math.abs(c - cur) === 1 ? go(c - cur) : jump(c);
}

function buildThumbs(){
  const g = $('#tgrid'); g.innerHTML = '';
  thumbs.forEach((src, i) => {
    const d = document.createElement('div'); d.className = 'th'; d.dataset.i = i;
    const im = new Image(); im.src = src; im.alt = '';
    const s = document.createElement('span'); s.textContent = i === padIdx ? '' : num(i);
    d.append(im, s); d.onclick = () => goToPage(i); g.appendChild(d);
  });
}
function closeThumbs(){ $('#thumbs').hidden = true; $('#tb').classList.remove('act'); }

function blank(w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.5);
}
function thumb(c){
  const t = document.createElement('canvas'); t.width = 150; t.height = Math.round(150 * c.height / c.width);
  t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
  return t.toDataURL('image/jpeg', 0.6);
}

function fadeLoader(){ const l = $('#loader'); l.classList.add('done'); setTimeout(() => { if (l.classList.contains('done')) l.hidden = true; }, 850); }
function restorePage(v){   // after switching language, stay on the same page
  const i = idxOf(Math.max(1, Math.min(orig, v)));
  if (mode === 'single'){ cur = i === padIdx ? Math.max(0, i - 1) : i; placeSingle(); updUI(); }
  else jump(i <= 0 ? 0 : Math.min(nSh, Math.ceil(i / 2)));
}
function build(imgs, th, r, links){
  ratio = r; orig = imgs.length; padIdx = -1; imgs = imgs.slice(); th = th.slice();
  const lk = (links || []).slice(); while (lk.length < orig) lk.push([]);
  // Odd page count: add a blank sheet before the back cover so it stays alone, like a printed magazine
  if (orig % 2 === 1){
    const b = blank(400, Math.round(400 * r)); padIdx = orig >= 3 ? orig - 1 : 1;
    imgs.splice(padIdx, 0, b); th.splice(padIdx, 0, b); lk.splice(padIdx, 0, []);
  }
  pages = imgs; plinks = lk; thumbs = th; total = pages.length; mode = null; cur = 0; anim = false;
  clearBk(); buildThumbs();
  $('#bar').hidden = false; $('#aprev').hidden = false; $('#anext').hidden = false; closeThumbs();
  ctrls.forEach(b => b.disabled = false);
  zoom = 1; const zm = $('#zoomer'); zm.style.width = zm.style.height = '100%';
  ready = true; sizeBook(); setZoomUI(); wake();
  requestAnimationFrame(() => requestAnimationFrame(fadeLoader));   // start the fade once the book is laid out, so it stays smooth
}

// Each PDF page is normalized to a canvas with the cover's proportions, never stretched:
// - double page (about 2x the cover's width): split into left and right pages
// - any other size: fitted whole and centered on white
// Maps a rectangle in source-canvas pixels to fractions (0..1) of the final page canvas, clipped to one half if split
function mapLink(r, sx, sw, k, ox, oy, W, H){
  const x0 = Math.max(Math.min(r[0], r[2]), sx), x1 = Math.min(Math.max(r[0], r[2]), sx + sw);
  const y0 = Math.min(r[1], r[3]), y1 = Math.max(r[1], r[3]);
  if (x1 - x0 < 2 || y1 - y0 < 2) return null;
  return { x: (ox + (x0 - sx) * k) / W, y: (oy + y0 * k) / H, w: (x1 - x0) * k / W, h: (y1 - y0) * k / H };
}
async function renderPages(page, a0, W, H){
  const v0 = page.getViewport({ scale: 1 });
  const rr = (v0.width / v0.height) / a0;
  const spread = rr > 1.85 && rr < 2.15;   // a true double page is ~2x the cover's width; a landscape single page is not
  const sc = spread ? H / v0.height : Math.min(W / v0.width, H / v0.height);
  const vp = page.getViewport({ scale: sc });
  const src = document.createElement('canvas'); src.width = Math.round(vp.width); src.height = Math.round(vp.height);
  await page.render({ canvasContext: src.getContext('2d'), viewport: vp }).promise;
  let anns = [];   // links that already live inside the PDF (never allowed to break the rendering)
  try {
    anns = (await page.getAnnotations({ intent: 'display' }))
      .filter(a => (a.url || a.unsafeUrl) && a.rect && /^(https?:|mailto:|tel:)/i.test(a.url || a.unsafeUrl))
      .map(a => ({ url: a.url || a.unsafeUrl, r: vp.convertToViewportRectangle(a.rect) }));
  } catch (e){ console.warn('links skipped', e); }
  const parts = spread ? [[0, src.width / 2], [src.width / 2, src.width / 2]] : [[0, src.width]];
  return parts.map(([sx, sw]) => {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    const k = Math.min(W / sw, H / src.height), dw = sw * k, dh = src.height * k;
    x.drawImage(src, sx, 0, sw, src.height, (W - dw) / 2, (H - dh) / 2, dw, dh);
    const links = anns.map(a => { const m = mapLink(a.r, sx, sw, k, (W - dw) / 2, (H - dh) / 2, W, H); return m && Object.assign(m, { url: a.url }); }).filter(Boolean);
    return { c, links };
  });
}
async function convertPdf(pdf, tok, keep){
  const n = Math.min(pdf.numPages, 300);
  const first = await pdf.getPage(1), f0 = first.getViewport({ scale: 1 });
  const a0 = f0.width / f0.height, W = 1400, H = Math.round(W / a0);
  const imgs = [], th = [], lks = [];
  for (let i = 1; i <= n; i++){
    if (tok !== loadTok) return;   // a newer load (language switch) took over
    const page = i === 1 ? first : await pdf.getPage(i);
    for (const { c, links } of await renderPages(page, a0, W, H)){ imgs.push(c.toDataURL('image/jpeg', 0.85)); th.push(thumb(c)); lks.push(links); }
    setProg(i / n); $('#ltxt').textContent = T('loading') + ' · ' + Math.round(i / n * 100) + '%';
  }
  if (tok !== loadTok) return;
  HOTSPOTS.filter(h => !h.lang || h.lang === lang).forEach(h => { const l = lks[h.page - 1]; if (l && /^(https?:|mailto:|tel:)/i.test(h.url)) l.push({ x: h.x / 100, y: h.y / 100, w: h.w / 100, h: h.h / 100, url: h.url }); });
  build(imgs, th, H / W, lks);
  if (keep > 1) restorePage(keep);
}

function showError(){
  $('#loader').classList.add('err');
  $('#ltxt').textContent = T('err');
  $('#lsub').textContent = T('errsub');
}
function srcFor(l){ return { url: PDFS[l] }; }
async function loadPDF(keep){
  const tok = ++loadTok;
  document.title = TITLE; $('#title').textContent = TITLE;
  const ld = $('#loader'); ld.classList.remove('done', 'err'); ld.hidden = false;
  $('#ltxt').textContent = T('loading'); $('#lsub').textContent = T('lsub');
  ready = false; $('#bar').hidden = true; $('#aprev').hidden = true; $('#anext').hidden = true; closeThumbs();
  setProg(0.02);
  try {
    if (!window.pdfjsLib) throw new Error('pdf.js unavailable');
    const pdf = await pdfjsLib.getDocument(srcFor(lang)).promise;
    await convertPdf(pdf, tok, keep);
  } catch (err){ if (tok !== loadTok) return; console.error(err); setProg(1); showError(); }
}
function setLang(l){
  if (l === lang || !PDFS[l]) return;
  const keep = ready ? num(visible()[0]) : 1;
  lang = l; applyLang();
  try { localStorage.setItem('daz_lang', l); } catch (e){}
  if (SYNC_URL){ try { const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u); } catch (e){} }
  loadPDF(keep);
}

function setZoomUI(){
  const mx = zoom >= 2.99;
  $('#zin').classList.toggle('max', mx); $('#zin').title = T(mx ? 'zout' : 'zin');
  $('#fit').classList.toggle('act', zoom === 1);
}
function setZoom(z, fx, fy, live){
  if (!ready) return;
  const sc = $('#scroll');
  let nz = Math.max(1, Math.min(3, z)); if (!live && nz < 1.03) nz = 1;
  if (fx == null){ fx = sc.clientWidth / 2; fy = sc.clientHeight / 2; }
  const rx = (sc.scrollLeft + fx) / sc.scrollWidth, ry = (sc.scrollTop + fy) / sc.scrollHeight;
  zoom = nz;
  $('#stage').classList.toggle('zoomed', zoom > 1);
  const zm = $('#zoomer'); zm.style.width = zm.style.height = (zoom * 100) + '%';
  sizeBook();
  sc.scrollLeft = rx * sc.scrollWidth - fx; sc.scrollTop = ry * sc.scrollHeight - fy;
  setZoomUI();
}

$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#aprev').onclick = () => go(-1);
$('#anext').onclick = () => go(1);
$('#zin').onclick = () => setZoom(zoom >= 2.99 ? 1 : zoom + 0.75);   // at the limit the same button zooms back out
$('#vm').onclick = () => { if (!ready) return; forced = mode === 'spread' ? 'single' : 'spread'; sizeBook(); };
$('#fit').onclick = () => setZoom(1);
$('#tb').onclick = () => { const t = $('#thumbs'); t.hidden = !t.hidden; $('#tb').classList.toggle('act', !t.hidden); };
$('#fs').onclick = () => { const s = $('#stage'); document.fullscreenElement ? document.exitFullscreen() : (s.requestFullscreen && s.requestFullscreen()); };
$('#pg').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const v = Math.max(1, Math.min(orig, parseInt(e.target.value, 10) || 1));
  goToPage(idxOf(v)); e.target.blur();
});
$('#pg').addEventListener('focus', e => e.target.select());
// click / tap: right half = next, left half = previous; swipe also works
let px = 0, py = 0;
bk.addEventListener('pointerdown', e => { px = e.clientX; py = e.clientY; });
bk.addEventListener('pointerup', e => {
  if (pinching || Date.now() - lastPinch < 350) return;
  const dx = e.clientX - px, dy = e.clientY - py;
  if (zoom <= 1.01 && Math.abs(dx) > 45 && Math.abs(dy) < 90){ go(dx < 0 ? 1 : -1); return; }
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10){
    if (e.target.closest && e.target.closest('.lk')) return;   // a tap on a link opens it, it doesn't turn the page
    const r = bk.getBoundingClientRect(), f = (e.clientX - r.left) / r.width;
    go(f > (mode === 'single' ? 0.4 : 0.5) ? 1 : -1);
  }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && ['+','=','-','_','0'].includes(e.key)){   // browser zoom shortcuts only zoom the document
    e.preventDefault(); if (ready) setZoom(e.key === '0' ? 1 : (e.key === '-' || e.key === '_') ? zoom - 0.5 : zoom + 0.5); return;
  }
  if (e.key === 'Escape') setMenu(false);
  if (!ready || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'Escape') closeThumbs();
});
window.addEventListener('resize', sizeBook);

// ---- zoom: pinch / ctrl+wheel / trackpad only scale the document, never the interface ----
let pinching = false, lastPinch = 0, pd0 = 1, pz0 = 1, gz0 = 1;
const tdist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
const stage = $('#stage');
let pan = null;
stage.addEventListener('touchstart', e => {
  if (!ready) return;
  if (e.touches.length === 2){ pinching = true; pan = null; pd0 = tdist(e.touches) || 1; pz0 = zoom; bk.classList.add('noanim'); }
  else if (e.touches.length === 1 && zoom > 1 && !e.target.closest('#bar,#thumbs,.arw,#loader')){
    const sc = $('#scroll'); pan = { x: e.touches[0].clientX, y: e.touches[0].clientY, l: sc.scrollLeft, t: sc.scrollTop };
  }
}, { passive: true });
stage.addEventListener('touchmove', e => {
  if (pinching && e.touches.length === 2){
    e.preventDefault();
    const d = tdist(e.touches) || 1, target = pz0 * d / pd0, nz = Math.max(1, Math.min(3, target));
    if (nz === zoom){ if (target !== nz){ pz0 = zoom; pd0 = d; } return; }   // at a limit: hold still, no bounce
    const r = $('#scroll').getBoundingClientRect();
    setZoom(nz, (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top, true);
    if (target !== nz){ pz0 = nz; pd0 = d; }   // re-anchor so reversing responds immediately
  } else if (pan && e.touches.length === 1){
    e.preventDefault();   // our own drag-to-pan: no native scrolling, so no rubber-band either
    const sc = $('#scroll');
    sc.scrollLeft = pan.l - (e.touches[0].clientX - pan.x); sc.scrollTop = pan.t - (e.touches[0].clientY - pan.y);
  }
}, { passive: false });
const endPinch = e => {
  pan = null;
  if (pinching && e.touches.length < 2){
    pinching = false; lastPinch = Date.now(); bk.classList.remove('noanim');
    if (zoom > 1 && zoom < 1.06) setZoom(1);
  }
};
stage.addEventListener('touchend', endPinch); stage.addEventListener('touchcancel', endPinch);
document.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault(); if (!ready) return;
  const r = $('#scroll').getBoundingClientRect(), dy = Math.max(-30, Math.min(30, e.deltaY));
  setZoom(zoom * Math.exp(-dy * 0.01), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => {   // Safari
  e.preventDefault();
  if (ev === 'gesturestart') gz0 = zoom;
  if (ev === 'gesturechange' && !pinching && ready && e.scale) setZoom(gz0 * e.scale);
}));

// the interface never scrolls: only the thumbnails panel does (the zoomed document is panned by our own drag)
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) return;
  if (e.target.closest && e.target.closest('#thumbs')) return;
  e.preventDefault();
}, { passive: false });

// ---- contact menu ----
const cbtn = $('#cbtn'), cmenu = $('#cmenu');
function setMenu(o){ cmenu.classList.toggle('open', o); cbtn.classList.toggle('act', o); cbtn.setAttribute('aria-expanded', o); }
cbtn.onclick = e => { e.stopPropagation(); setMenu(!cmenu.classList.contains('open')); };
document.addEventListener('click', e => { if (!cmenu.contains(e.target)) setMenu(false); });
// idle: the bar dims softly and the side arrows breathe; any interaction brings them back
let idleT = null;
function wake(){ $('#stage').classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => $('#stage').classList.add('idle'), 3500); }
['pointermove','pointerdown','keydown','touchstart','wheel'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));
$('#lang').hidden = !(PDFS.es && PDFS.en);
document.querySelectorAll('#lang button').forEach(b => { b.onclick = () => setLang(b.dataset.lang); });
lang = pickLang(); applyLang(); loadPDF(1);
</script>
</body>
